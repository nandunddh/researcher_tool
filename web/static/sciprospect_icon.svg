<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sci-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sci-sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="sci-lens-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>
    <filter id="sci-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(45, 30)">
    <!-- Orbiting Data Rings in background -->
    <ellipse cx="140" cy="230" rx="175" ry="72" transform="rotate(-30 140 230)"
      fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <ellipse cx="140" cy="230" rx="175" ry="72" transform="rotate(30 140 230)"
      fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Orbit Nodes -->
    <circle cx="-15" cy="180" r="9" fill="#00F2FE" filter="url(#sci-glow)" />
    <circle cx="-15" cy="180" r="4.5" fill="#FFFFFF" />
    <circle cx="285" cy="300" r="9" fill="#00F2FE" filter="url(#sci-glow)" />
    <circle cx="285" cy="300" r="4.5" fill="#FFFFFF" />

    <!-- Research Paper Document Card -->
    <!-- Base Paper -->
    <path d="M 40,40 L 195,40 L 255,100 L 255,410 L 40,410 Z"
      fill="#FFFFFF" stroke="#1E293B" stroke-width="12" stroke-linejoin="round" />
    <!-- Folded Paper Corner -->
    <path d="M 195,40 L 195,100 L 255,100 Z"
      fill="#E2E8F0" stroke="#1E293B" stroke-width="12" stroke-linejoin="round" />

    <!-- Document Header Abstract Thumbnail / Photo Box -->
    <rect x="70" y="85" width="48" height="52" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4" />
    <!-- Document Abstract Text Lines -->
    <line x1="130" y1="92" x2="185" y2="92" stroke="#64748B" stroke-width="7" stroke-linecap="round" />
    <line x1="130" y1="112" x2="185" y2="112" stroke="#64748B" stroke-width="7" stroke-linecap="round" />
    <line x1="130" y1="132" x2="175" y2="132" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />

    <!-- Article Body Data Lines -->
    <line x1="70" y1="168" x2="180" y2="168" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="70" y1="192" x2="140" y2="192" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="70" y1="216" x2="120" y2="216" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round" />
    <line x1="70" y1="360" x2="225" y2="360" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round" />
    <line x1="70" y1="384" x2="175" y2="384" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round" />

    <!-- Discovery Magnifying Glass (Positioned over paper) -->
    <!-- Magnifier Lens Frame -->
    <circle cx="210" cy="255" r="95" fill="url(#sci-lens-glass)" stroke="#0F172A" stroke-width="15" />
    <circle cx="210" cy="255" r="84" fill="none" stroke="url(#sci-cyan-blue)" stroke-width="8" />

    <!-- Magnifier Handle -->
    <line x1="280" y1="325" x2="365" y2="410" stroke="#0F172A" stroke-width="26" stroke-linecap="round" />
    <line x1="280" y1="325" x2="360" y2="405" stroke="url(#sci-sapphire)" stroke-width="16" stroke-linecap="round" />
    <line x1="286" y1="331" x2="350" y2="395" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

    <!-- Scholar Network Inside Lens (Researcher Profiles & Co-author Connections) -->
    <line x1="165" y1="280" x2="195" y2="235" stroke="#0284C7" stroke-width="5" />
    <line x1="195" y1="235" x2="250" y2="215" stroke="#0284C7" stroke-width="5" />
    <line x1="195" y1="235" x2="225" y2="285" stroke="#0284C7" stroke-width="5" />
    <line x1="225" y1="285" x2="260" y2="260" stroke="#0284C7" stroke-width="5" />

    <circle cx="165" cy="280" r="11" fill="#0284C7" />
    <circle cx="165" cy="280" r="5" fill="#FFFFFF" />

    <circle cx="195" cy="235" r="15" fill="#00F2FE" filter="url(#sci-glow)" />
    <circle cx="195" cy="235" r="7" fill="#FFFFFF" />

    <circle cx="250" cy="215" r="12" fill="#0284C7" />
    <circle cx="250" cy="215" r="5.5" fill="#FFFFFF" />

    <circle cx="225" cy="285" r="13" fill="#1D4ED8" />
    <circle cx="225" cy="285" r="6" fill="#FFFFFF" />

    <circle cx="260" cy="260" r="10" fill="#00F2FE" />
    <circle cx="260" cy="260" r="4.5" fill="#FFFFFF" />
  </g>
</svg>