<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SciProspect — Original A</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3fb;font-family:system-ui,sans-serif;color:#09152e}main{text-align:center;width:min(720px,94vw);padding:48px 20px;background:white;border-radius:28px;box-shadow:0 20px 80px #12315a12}canvas{width:180px;height:180px;display:block;margin:0 auto;filter:drop-shadow(0 10px 18px #00bcd414)}h1{font-size:clamp(32px,7vw,52px);letter-spacing:-2px;margin:12px 0 32px}button{padding:12px 20px;border:1px solid #d9e2ee;background:#f7faff;border-radius:10px;font:inherit;color:#174272;cursor:pointer}p{font-size:13px;color:#677b96;margin-top:28px}.reveal{animation:reveal 1.8s cubic-bezier(.16,1,.3,1) both}@keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
#brand{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,24px);margin:12px 0 36px}#brand canvas{width:clamp(64px,14vw,110px);height:clamp(64px,14vw,110px);flex-shrink:0;margin:0}#brand h1{margin:0;font-size:clamp(28px,6.5vw,52px);letter-spacing:-1.5px;line-height:1.1;white-space:nowrap}
</style>
<main><div id="brand" class="reveal"><canvas width="360" height="360" role="img" aria-label="Original option A blue and cyan S logo with discovery dot"></canvas><h1>SciProspect</h1></div><button id="replay">Replay animation</button> <button id="switch">Show SciStudio</button><p>Original option A artwork · subtle reveal</p></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),img=new Image(),brand=document.getElementById('brand');
img.onload=()=>{ctx.clearRect(0,0,360,360);ctx.drawImage(img,25,280,145,145,0,0,360,360)};img.src='logo-concepts.png';
document.getElementById('replay').onclick=()=>{brand.classList.remove('reveal');void brand.offsetWidth;brand.classList.add('reveal')};
document.getElementById('switch').onclick=e=>{const studio=document.querySelector('h1').textContent==='SciProspect';document.querySelector('h1').textContent=studio?'SciStudio':'SciProspect';e.target.textContent=studio?'Show SciProspect':'Show SciStudio';document.getElementById('replay').click()};
</script></html>
